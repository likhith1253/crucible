<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRUCIBLE | Pressure Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0F1C; --bg-2:#0D1424; --card:#111A2D; --card-2:#16213A; --line:#1F2C47; --line-2:#18233A;
  --ink:#ECEFF6; --ink-2:#B9C2D3; --muted:#7D89A1;
  --blue:#5B86E5; --blue-deep:#2C4E9E; --pink:#D9578F; --gold:#D8B25E;
  --pos:#5DB891; --neg:#DE7C6C; --grey:#3A4763;
  --ease:cubic-bezier(.2,.7,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,sans-serif;font-feature-settings:"tnum" 1;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(1200px 600px at 85% -10%,rgba(44,78,158,.28),transparent 60%),radial-gradient(900px 500px at -10% 10%,rgba(217,87,143,.10),transparent 60%),var(--bg);background-attachment:fixed}
.wrap{max-width:1280px;margin:0 auto;padding:0 28px}
/* header */
header{padding:34px 0 0}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:28px;flex-wrap:wrap}
.brand h1{font-family:"Playfair Display",Georgia,serif;font-weight:800;font-size:46px;letter-spacing:.08em;margin:0;line-height:1}
.brand h1 span{color:var(--gold)}
.brand .sub{margin-top:10px;font-size:11.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--blue);font-weight:600}
.brand .tag{margin-top:10px;color:var(--ink-2);font-size:15px;max-width:520px}
.facts{display:flex;gap:28px;flex-wrap:wrap}
.fact b{display:block;font-size:26px;font-weight:600;letter-spacing:-.01em}
.fact span{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
nav.tabs{display:flex;gap:6px;margin-top:30px;border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{appearance:none;border:0;background:none;color:var(--muted);font:600 12.5px Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:14px 18px;position:relative;cursor:pointer;transition:color .25s}
nav.tabs button:after{content:"";position:absolute;left:18px;right:18px;bottom:-1px;height:2px;background:var(--gold);transform:scaleX(0);transition:transform .35s var(--ease)}
nav.tabs button[aria-selected=true]{color:var(--ink)}
nav.tabs button[aria-selected=true]:after{transform:scaleX(1)}
nav.tabs button:hover{color:var(--ink-2)}
main{padding:30px 0 70px}
.view{animation:fade .5s var(--ease)}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
section{margin-bottom:24px}
.grid{display:grid;gap:22px}
.g-main{grid-template-columns:minmax(0,1.45fr) minmax(0,1fr)}
.g-2{grid-template-columns:1fr 1fr}
.g-3{grid-template-columns:repeat(3,1fr)}
.card{background:linear-gradient(180deg,var(--card-2),var(--card));border:1px solid var(--line);border-radius:16px;padding:22px 24px;min-width:0}
.card h2{font-size:15px;font-weight:600;margin:0 0 3px;letter-spacing:.01em}
.card .note{font-size:12.5px;color:var(--muted);margin:0 0 16px}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600}
/* podium */
.pod{position:relative;overflow:hidden;padding:20px 22px 18px;display:flex;gap:18px;align-items:center}
.pod .rank{position:absolute;right:14px;top:-14px;font-family:"Playfair Display",serif;font-size:96px;font-weight:800;color:rgba(255,255,255,.04);line-height:1}
.pod .who{flex:1;min-width:0}
.pod .who b{display:block;font-size:18px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pod .who span{font-size:12px;color:var(--muted)}
.pod .big{font-size:24px;font-weight:600;margin-top:6px}
.pod.first{border-color:rgba(216,178,94,.45)}
.ring circle{fill:none;stroke-width:7}
.ring .track{stroke:var(--line)}
.ring .arc{stroke-linecap:round;transition:stroke-dashoffset 1.4s var(--ease)}
/* table */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:right;padding:8px 8px;border-bottom:1px solid var(--line)}
th:nth-child(1),th:nth-child(2){text-align:left}
td{padding:10px 8px;border-bottom:1px solid var(--line-2);text-align:right;white-space:nowrap}
td:nth-child(1){text-align:left;width:34px;color:var(--muted);font-weight:600}
td:nth-child(2){text-align:left}
tbody tr{cursor:pointer;transition:background .2s}
tbody tr:hover{background:rgba(91,134,229,.06)}
tbody tr.sel{background:rgba(91,134,229,.12);box-shadow:inset 3px 0 0 var(--gold)}
tbody tr{opacity:0;transform:translateX(-6px);animation:rowin .5s var(--ease) forwards}
@keyframes rowin{to{opacity:1;transform:none}}
.pname{font-weight:600}
.pbasis{display:block;font-size:11px;color:var(--muted)}
.pbasis.j{color:var(--gold)}
.bar{position:relative;height:6px;background:var(--line);border-radius:3px;width:150px}
.bar i{position:absolute;top:0;bottom:0;border-radius:3px;transition:width 1.1s var(--ease),left 1.1s var(--ease)}
.bar .z{position:absolute;top:-4px;bottom:-4px;width:1px;background:var(--muted);left:50%}
.val{display:inline-block;min-width:46px;font-weight:600}
.pos{color:var(--pos)} .neg{color:var(--neg)}
.blocks{display:inline-flex;gap:3px;vertical-align:middle}
.blocks i{width:8px;height:16px;border-radius:2px;display:block;transform:scaleY(0);transform-origin:bottom;animation:grow .6s var(--ease) forwards}
@keyframes grow{to{transform:scaleY(1)}}
/* detail */
.dhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dname{font-family:"Playfair Display",Georgia,serif;font-size:28px;font-weight:700;margin:2px 0 2px;line-height:1.15}
.drk{color:var(--muted);font-size:12.5px}
.chip{font-size:11px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.chip.j{border-color:rgba(216,178,94,.5);color:var(--gold)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0 6px}
.kpi{background:rgba(255,255,255,.02);border:1px solid var(--line-2);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font-size:18px;font-weight:600}
.kpi span{font-size:11px;color:var(--muted)}
.basis{font-size:12.5px;padding:12px 14px;border-radius:10px;background:rgba(255,255,255,.025);border:1px solid var(--line-2);color:var(--ink-2);margin-top:14px}
.basis b{color:var(--ink)}
.basis.j{border-color:rgba(216,178,94,.3)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.legend i.sq{border-radius:2px}
svg text{font-family:Inter,sans-serif}
.dot{transform-box:fill-box;transform-origin:center;transform:scale(0);animation:pop .55s var(--ease) forwards}
@keyframes pop{to{transform:scale(1)}}
.draw{stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 1.3s var(--ease) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.fadein{opacity:0;animation:fo .8s var(--ease) forwards}
@keyframes fo{to{opacity:1}}
.radar-shape{transform-box:view-box;transform-origin:center;transform:scale(.05);opacity:0;transition:transform 1s var(--ease),opacity .6s}
.radar-shape.on{transform:scale(1);opacity:1}
.sbar{transform-box:fill-box;transform:scaleY(0);transition:transform .9s var(--ease)}
.sbar.up{transform-origin:bottom}.sbar.down{transform-origin:top}
.sbar.on{transform:scaleY(1)}
/* excluded */
.ex{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.exc{border:1px solid var(--line-2);border-radius:12px;padding:12px 14px;background:rgba(255,255,255,.015)}
.exc b{font-weight:600}
.exc .m{font-size:11.5px;color:var(--muted)}
.exc p{margin:6px 0 0;font-size:12.5px;color:var(--ink-2)}
/* network */
.net-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:22px}
.link{fill:none;transition:opacity .25s,stroke-width .25s}
.node text{font-size:12.5px;font-weight:500;cursor:pointer;transition:fill .2s}
.node circle{transition:r .25s}
.side h3{font-family:"Playfair Display",serif;font-size:22px;margin:0 0 2px}
.hh{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.hh span:last-child{font-weight:600}
/* method */
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;position:relative}
.step{position:relative;padding-top:46px}
.step .n{position:absolute;top:0;left:0;width:34px;height:34px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-weight:700;font-size:13px;background:var(--card)}
.step h3{font-size:13.5px;margin:0 0 6px;font-weight:600}
.step p{margin:0;font-size:12.5px;color:var(--muted)}
.steps:before{content:"";position:absolute;top:17px;left:17px;right:17px;height:1px;background:linear-gradient(90deg,var(--gold),var(--blue));transform:scaleX(0);transform-origin:left;animation:line 1.6s .2s var(--ease) forwards}
@keyframes line{to{transform:scaleX(1)}}
.stat{font-size:34px;font-weight:600;line-height:1.1;letter-spacing:-.01em}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:14px}
.statrow span{font-size:12px;color:var(--muted)}
.cell{transform-box:fill-box;transform-origin:center;transform:scale(.4);opacity:0;animation:cell .6s var(--ease) forwards}
@keyframes cell{to{transform:scale(1);opacity:1}}
.pbar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;border-radius:5px;width:0;transition:width 1.2s var(--ease)}
footer{border-top:1px solid var(--line);padding:20px 0;color:var(--muted);font-size:12px}
@media (max-width:1020px){.g-main,.g-2,.net-wrap{grid-template-columns:1fr}.steps{grid-template-columns:1fr 1fr}.steps:before{display:none}}
@media (max-width:820px){.hide-s{display:none}.g-3{grid-template-columns:1fr}}
@media (max-width:640px){.wrap{padding:0 16px}.brand h1{font-size:36px}.facts{gap:18px}.fact b{font-size:20px}.kpis{grid-template-columns:repeat(2,1fr)}.bar{width:80px}.steps{grid-template-columns:1fr}.statrow{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.dot,.cell,tbody tr,.blocks i,.fadein{opacity:1;transform:none}.draw{stroke-dashoffset:0;stroke-dasharray:none!important}.steps:before{transform:none}.radar-shape,.sbar{transform:none;opacity:1}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <div class="hero">
      <div class="brand">
        <h1>CRUCIBLE<span>.</span></h1>
        <div class="sub">T20 Performance Intelligence</div>
        <div class="tag">Separating proven performers from pressure-tested performers.</div>
      </div>
      <div class="facts" id="facts"></div>
    </div>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="bat" aria-selected="true">Batters</button>
      <button role="tab" data-tab="bowl" aria-selected="false">Bowlers</button>
      <button role="tab" data-tab="net" aria-selected="false">Matchups</button>
      <button role="tab" data-tab="method" aria-selected="false">Method</button>
    </nav>
  </div>
</header>

<main class="wrap" id="main"></main>
<footer><div class="wrap">CRUCIBLE · Pressure reveals performance. Data reveals the truth. · IPL and T20I ball-by-ball, <span id="span"></span></div></footer>

<template id="t-players">
  <div class="view">
    <section class="grid g-3" id="podium"></section>
    <section class="grid g-main">
      <div class="card">
        <h2 id="list-title"></h2>
        <p class="note" id="list-note"></p>
        <div class="tw"><table id="list"></table></div>
      </div>
      <div class="card" id="detail"></div>
    </section>
    <section class="grid g-2">
      <div class="card">
        <h2>Do both models agree?</h2>
        <p class="note">Full-model rank against pressure-only rank. On the dashed line, both fits rank a player the same.</p>
        <div id="agree"></div>
        <div class="legend"><span><i style="background:var(--gold)"></i>Final ten</span><span><i style="background:var(--grey)"></i>Top-30 pool</span></div>
      </div>
      <div class="card">
        <h2>IPL and T20I, side by side</h2>
        <p class="note" id="split-note"></p>
        <div id="split"></div>
        <div class="legend"><span><i style="background:var(--gold)"></i>Final ten</span><span><i style="background:var(--grey)"></i>Top-30 pool</span><span>Size: pressure balls</span></div>
      </div>
    </section>
    <section class="card">
      <h2>Left out, and why</h2>
      <p class="note">Players the model placed in or near the top ten who are not on the list.</p>
      <div class="ex" id="excluded"></div>
    </section>
  </div>
</template>

<template id="t-net">
  <div class="view">
    <section class="card">
      <h2>Head to head: the final twenty</h2>
      <p class="note">Every meeting between a listed batter and a listed bowler with at least six balls. Line width shows balls faced. Blue: the batter scored above expected. Pink: the bowler held him below it. Hover a name.</p>
      <div class="net-wrap">
        <div id="net"></div>
        <div class="side" id="netside"></div>
      </div>
      <div class="legend"><span><i class="sq" style="background:var(--blue)"></i>Batter above expected</span><span><i class="sq" style="background:var(--pink)"></i>Bowler on top</span></div>
    </section>
  </div>
</template>

<template id="t-method">
  <div class="view">
    <section class="card">
      <h2>How a ranking is built</h2>
      <p class="note">From ball-by-ball data to two lists of ten.</p>
      <div class="steps">
        <div class="step"><div class="n">1</div><h3>Expected outcome</h3><p>Player-blind models give each ball's win probability and expected result from the match state alone.</p></div>
        <div class="step"><div class="n">2</div><h3>Pressure</h3><p>What the side could lose on the ball, scaled by what the match means for the season. The top 20% of balls are pressure balls.</p></div>
        <div class="step"><div class="n">3</div><h3>Matchup network</h3><p>All batters and bowlers are fitted together, so every rating is adjusted for who was actually faced.</p></div>
        <div class="step"><div class="n">4</div><h3>Two converged fits</h3><p>A full model and a pressure-only model. A player ranks high only when both agree.</p></div>
        <div class="step"><div class="n">5</div><h3>Selection review</h3><p>Availability, IPL and T20I record, sample size. Every change from model order is listed.</p></div>
      </div>
    </section>
    <section class="grid g-2">
      <div class="card">
        <h2>Where batting pressure sits in a chase</h2>
        <p class="note">Share of second-innings balls that are pressure balls for the batter.</p>
        <div id="heat"></div>
      </div>
      <div class="card">
        <h2>Pressure balls by phase</h2>
        <p class="note">A powerplay collapse or a stalled middle phase counts, not only the death overs.</p>
        <div id="phase"></div>
        <div class="legend"><span><i class="sq" style="background:var(--blue)"></i>Batting pressure</span><span><i class="sq" style="background:var(--pink)"></i>Bowling pressure</span></div>
      </div>
    </section>
    <section class="grid g-2">
      <div class="card">
        <h2>Does it hold up over time?</h2>
        <p class="note">Measured on 2022–24, checked on 2025–26 (players with 60+ pressure balls in each period).</p>
        <div id="oot"></div>
      </div>
      <div class="card">
        <h2>Virtual knockouts</h2>
        <p class="note">Stakes come from simulating the rest of each season, 3,000 times per match.</p>
        <div id="stakes"></div>
      </div>
    </section>
  </div>
</template>

<script src="data.js"></script>
<script>
const D = window.CRUCIBLE, NS = "http://www.w3.org/2000/svg";
const fmt = (v, d = 1, sign = true) => v == null ? "–" : (sign && v > 0 ? "+" : "") + Number(v).toFixed(d);
const cls = v => v == null ? "" : v > 0 ? "pos" : v < 0 ? "neg" : "";
function el(tag, a = {}, parent) { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); if (parent) parent.appendChild(e); return e; }
function txt(parent, x, y, s, a = {}) { const t = el("text", Object.assign({x, y}, a), parent); t.textContent = s; return t; }
const svgBox = (host, W, H) => { const s = el("svg", {viewBox: `0 0 ${W} ${H}`, width: "100%"}); host.appendChild(s); return s; };
const later = (f, ms = 30) => setTimeout(f, ms);
function countUp(node, to, dec = 0, suffix = "", ms = 1200) {
  const t0 = performance.now();
  const step = t => { const p = Math.min(1, (t - t0) / ms), e = 1 - Math.pow(1 - p, 3); node.textContent = (to * e).toFixed(dec) + suffix; if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

const CFG = {
  bat: {
    title: "Most reliable batters under pressure", main: "vs_expected", mainLabel: "Runs above expected", d: 1,
    note: "Runs above expected per 100 pressure balls, against an average batter in exactly the same situations.",
    cols: [["pressure_balls", "Balls", 0, false], ["pressure_sr", "SR", 0, false]],
    kpis: [["pressure_sr", "Pressure strike rate", 0, false], ["balls_per_dismissal", "Balls per dismissal", 1, false], ["pressure_balls", "Pressure balls", 0, false],
           ["high_stakes_vs_expected", "High-stakes games", 1, true], ["chase_vs_expected", "In chases", 1, true], ["recent_vs_expected", "2025–26", 1, true]],
    radar: [["vs_expected", "Overall"], ["ipl_vs_expected", "IPL"], ["t20i_vs_expected", "T20I"], ["high_stakes_vs_expected", "High stakes"], ["chase_vs_expected", "Chases"], ["recent_vs_expected", "2025–26"], ["cons", "Consistency"]],
    ipl: "ipl_vs_expected", t20i: "t20i_vs_expected", unit: "per 100 balls", ext: [-40, 120], ticks: [-40, 0, 40, 80, 120], sScale: 40,
    seasonUnit: "Runs above expected per 100 pressure balls",
    splitNote: "Runs above expected per 100 pressure balls in each competition. Shaded: above expected in both."
  },
  bowl: {
    title: "Most reliable bowlers under pressure", main: "runs_saved_per_over", mainLabel: "Runs saved / over", d: 2,
    note: "Runs saved per over against an average bowler in exactly the same situations, extras included.",
    cols: [["pressure_balls", "Balls", 0, false], ["pressure_economy", "Econ", 2, false]],
    kpis: [["pressure_economy", "Pressure economy", 2, false], ["dot_pct", "Dot balls %", 1, false], ["death_economy", "Death-over economy", 2, false],
           ["high_stakes_saved", "High-stakes games", 2, true], ["defending_saved", "Defending a target", 2, true], ["recent_saved", "2025–26", 2, true]],
    radar: [["runs_saved_per_over", "Overall"], ["ipl_saved", "IPL"], ["t20i_saved", "T20I"], ["high_stakes_saved", "High stakes"], ["defending_saved", "Defending"], ["death_inv", "Death overs"], ["cons", "Consistency"]],
    ipl: "ipl_saved", t20i: "t20i_saved", unit: "per over", ext: [-1.5, 3.5], ticks: [-1, 0, 1, 2, 3], sScale: 2.5,
    seasonUnit: "Runs saved per over under pressure",
    splitNote: "Runs saved per over under pressure in each competition. Shaded: better than average in both."
  }
};
["bat", "bowl"].forEach(s => [...D[s].pool, ...D[s].final].forEach(p => { p.cons = p.season_blocks ? p.season_blocks_positive / p.season_blocks : null; p.death_inv = p.death_economy == null ? null : -p.death_economy; }));
let side = "bat", selected = 0;

function facts() {
  const f = D.facts, items = [[f.matches, 0, "", "Matches"], [f.deliveries / 1000, 1, "k", "Deliveries"], [f.matchups / 1000, 1, "k", "Batter–bowler pairs"], [f.eligible_batters + f.eligible_bowlers, 0, "", "Players rated"]];
  const host = document.getElementById("facts");
  host.innerHTML = items.map(i => `<div class="fact"><b>0</b><span>${i[3]}</span></div>`).join("");
  host.querySelectorAll("b").forEach((b, i) => countUp(b, items[i][0], items[i][1], items[i][2]));
  document.getElementById("span").textContent = f.first.slice(0, 4) + "–" + f.last.slice(0, 4);
}

/* ---------- players view ---------- */
function podium() {
  const C = CFG[side], rows = D[side].final.slice(0, 3), mx = Math.max(...D[side].pool.map(p => p[C.main] || 0));
  const host = document.getElementById("podium");
  host.innerHTML = rows.map((r, i) => `<div class="card pod ${i === 0 ? "first" : ""}" data-i="${i}" style="cursor:pointer">
      <div class="rank">${r.rank}</div>
      <svg class="ring" width="74" height="74" viewBox="0 0 74 74"><circle class="track" cx="37" cy="37" r="30"/>
        <circle class="arc" cx="37" cy="37" r="30" stroke="${i === 0 ? "var(--gold)" : "var(--blue)"}" stroke-dasharray="188.5" stroke-dashoffset="188.5" transform="rotate(-90 37 37)" data-p="${Math.max(0, r[C.main]) / mx}"/>
        <text x="37" y="42" text-anchor="middle" style="fill:var(--ink);font-size:15px;font-weight:600">#${r.rank}</text></svg>
      <div class="who"><span class="eyebrow">${i === 0 ? "Most reliable" : "Rank " + r.rank}</span><b>${r.name}</b>
        <div class="big ${cls(r[C.main])}">${fmt(r[C.main], C.d)}</div><span>${C.mainLabel.toLowerCase()} ${C.unit}</span></div></div>`).join("");
  later(() => host.querySelectorAll(".arc").forEach(a => a.style.strokeDashoffset = 188.5 * (1 - a.dataset.p)), 80);
  host.querySelectorAll(".pod").forEach(p => p.onclick = () => { selected = +p.dataset.i; list(false); detail(); });
}

function blocksHTML(seasons, C, delay) {
  return `<span class="blocks">${Object.keys(seasons).sort().map((k, j) => { const v = seasons[k];
    return `<i title="${k}: ${fmt(v, 2)}" style="background:${v > 0 ? "var(--pos)" : "var(--neg)"};opacity:${Math.min(1, .35 + Math.abs(v) / C.sScale)};animation-delay:${delay + j * 40}ms"></i>`; }).join("")}</span>`;
}

function list(animate = true) {
  const C = CFG[side], rows = D[side].final;
  document.getElementById("list-title").textContent = C.title;
  document.getElementById("list-note").textContent = C.note;
  const mx = Math.max(...rows.map(r => Math.abs(r[C.main])));
  const head = `<thead><tr><th>#</th><th>Player</th>${C.cols.map(c => `<th class="hide-s">${c[1]}</th>`).join("")}<th>${C.mainLabel}</th><th class="hide-s">Seasons</th></tr></thead>`;
  const body = rows.map((r, i) => {
    const v = r[C.main], w = Math.abs(v) / mx * 50, judged = r.basis !== "Model order", dl = animate ? i * 55 : 0;
    return `<tr data-i="${i}" class="${i === selected ? "sel" : ""}" style="animation-delay:${dl}ms;${animate ? "" : "opacity:1;transform:none;animation:none"}"><td>${r.rank}</td>
      <td><span class="pname">${r.name}</span><span class="pbasis ${judged ? "j" : ""}">${judged ? "Selection review" : "Model rank " + r.model_rank}</span></td>
      ${C.cols.map(c => `<td class="hide-s">${fmt(r[c[0]], c[2], c[3])}</td>`).join("")}
      <td><div style="display:flex;align-items:center;gap:12px;justify-content:flex-end"><span class="val ${cls(v)}">${fmt(v, C.d)}</span>
        <div class="bar"><i data-w="${w}" data-l="${v >= 0 ? 50 : 50 - w}" style="left:50%;width:${animate ? 0 : w}%;${animate ? "" : `left:${v >= 0 ? 50 : 50 - w}%;`}background:${v >= 0 ? "var(--pos)" : "var(--neg)"}"></i><span class="z"></span></div></div></td>
      <td class="hide-s">${blocksHTML(r.seasons, C, animate ? 300 + i * 55 : 0)}</td></tr>`;
  }).join("");
  const t = document.getElementById("list"); t.innerHTML = head + "<tbody>" + body + "</tbody>";
  if (animate) later(() => t.querySelectorAll(".bar i").forEach(b => { b.style.width = b.dataset.w + "%"; b.style.left = b.dataset.l + "%"; }), 120);
  t.querySelectorAll("tbody tr").forEach(tr => tr.onclick = () => { selected = +tr.dataset.i; list(false); detail(); });
}

function pct(pool, key, v) { const xs = pool.map(p => p[key]).filter(x => x != null); if (v == null || !xs.length) return 0; return xs.filter(x => x <= v).length / xs.length; }

function radar(host, r, C) {
  const pool = D[side].pool, W = 400, H = 290, cx = W / 2, cy = 146, R = 100, n = C.radar.length;
  const svg = svgBox(host, W, H), ang = i => -Math.PI / 2 + i * 2 * Math.PI / n, pt = (i, f) => [cx + Math.cos(ang(i)) * R * f, cy + Math.sin(ang(i)) * R * f];
  [.25, .5, .75, 1].forEach(f => el("polygon", {points: C.radar.map((_, i) => pt(i, f).join(",")).join(" "), style: `fill:none;stroke:var(--line);stroke-width:1`}, svg));
  C.radar.forEach(([k, lab], i) => { const [x, y] = pt(i, 1); el("line", {x1: cx, y1: cy, x2: x, y2: y, style: "stroke:var(--line)"}, svg);
    const [lx, ly] = pt(i, 1.2); txt(svg, lx, ly + 4, lab, {"text-anchor": Math.abs(lx - cx) < 8 ? "middle" : lx > cx ? "start" : "end", style: "fill:var(--muted);font-size:10.5px"}); });
  const med = C.radar.map((_, i) => pt(i, .5).join(",")).join(" ");
  el("polygon", {points: med, style: "fill:none;stroke:var(--muted);stroke-dasharray:3 3;stroke-width:1"}, svg);
  const vals = C.radar.map(([k]) => Math.max(.04, pct(pool, k, r[k])));
  const g = el("g", {class: "radar-shape"}, svg);
  el("polygon", {points: vals.map((f, i) => pt(i, f).join(",")).join(" "), style: "fill:rgba(216,178,94,.18);stroke:var(--gold);stroke-width:2;stroke-linejoin:round"}, g);
  vals.forEach((f, i) => { const [x, y] = pt(i, f); el("circle", {cx: x, cy: y, r: 3.2, style: "fill:var(--gold)"}, g).appendChild(el("title")).textContent = `${C.radar[i][1]}: better than ${Math.round(f * 100)}% of the top-30 pool`; });
  later(() => g.classList.add("on"), 60);
}

function seasonChart(host, seasons, C) {
  const keys = Object.keys(seasons).sort(), W = 440, H = 160, m = {l: 30, r: 6, t: 8, b: 32};
  const vals = keys.map(k => seasons[k]), mx = Math.max(...vals.map(Math.abs), C.sScale / 2) * 1.1;
  const svg = svgBox(host, W, H), y = v => m.t + (H - m.t - m.b) / 2 - v / mx * (H - m.t - m.b) / 2, bw = (W - m.l - m.r) / keys.length;
  el("line", {x1: m.l, x2: W - m.r, y1: y(0), y2: y(0), style: "stroke:var(--muted)"}, svg);
  [mx * .66, -mx * .66].forEach(t => { el("line", {x1: m.l, x2: W - m.r, y1: y(t), y2: y(t), style: "stroke:var(--line);stroke-dasharray:2 3"}, svg); txt(svg, m.l - 6, y(t) + 3, fmt(t, side === "bat" ? 0 : 1), {"text-anchor": "end", style: "fill:var(--muted);font-size:10px"}); });
  const bars = [];
  keys.forEach((k, i) => { const v = seasons[k], x = m.l + i * bw + bw * .22, ipl = k.endsWith("IPL");
    const b = el("rect", {x, width: bw * .56, y: Math.min(y(0), y(v)), height: Math.max(1, Math.abs(y(v) - y(0))), rx: 3, class: "sbar " + (v >= 0 ? "up" : "down"),
      style: `fill:${v >= 0 ? "var(--pos)" : "var(--neg)"};opacity:${ipl ? 1 : .5};transition-delay:${i * 60}ms`}, svg);
    el("title", {}, b).textContent = `${k}: ${fmt(v, 2)}`; bars.push(b);
    const [yr, c] = k.split("-"); txt(svg, x + bw * .28, H - 17, "'" + yr.slice(2), {"text-anchor": "middle", style: "fill:var(--ink-2);font-size:10.5px"});
    txt(svg, x + bw * .28, H - 4, c, {"text-anchor": "middle", style: "fill:var(--muted);font-size:9px"}); });
  later(() => bars.forEach(b => b.classList.add("on")), 60);
}

function detail() {
  const C = CFG[side], r = D[side].final[selected], host = document.getElementById("detail"), judged = r.basis !== "Model order";
  host.innerHTML = `<div class="view"><div class="dhead"><div><span class="eyebrow">Rank ${r.rank}</span><p class="dname">${r.name}</p>
      <div class="drk">Full model ${r.full_model_rank} · pressure-only ${r.pressure_only_rank} · last match ${r.last_match}</div></div>
      <span class="chip ${judged ? "j" : ""}">${judged ? "Selection review" : "Model order"}</span></div>
    <div id="radar"></div>
    <div class="legend" style="justify-content:center;margin-top:-4px"><span><i style="background:var(--gold)"></i>Percentile in the top-30 pool</span><span><i style="background:transparent;border:1px dashed var(--muted)"></i>Pool median</span></div>
    <div class="kpis">${C.kpis.map(k => `<div class="kpi"><b class="${k[3] ? cls(r[k[0]]) : ""}">${fmt(r[k[0]], k[2], k[3])}</b><span>${k[1]}</span></div>`).join("")}</div>
    <p class="note" style="margin:14px 0 2px">${C.seasonUnit}, season by season. Solid: IPL. Light: T20I. ${r.season_blocks_positive} of ${r.season_blocks} positive.</p>
    <div id="season"></div>
    <div class="basis ${judged ? "j" : ""}"><b>${judged ? "Why he is here." : "Model order."}</b> ${judged ? r.basis : "Placed by the average of his two model ranks, with no adjustment."}</div></div>`;
  radar(document.getElementById("radar"), r, C);
  seasonChart(document.getElementById("season"), r.seasons, C);
}

function scatter(host, pts, xk, yk, o) {
  host.innerHTML = ""; const W = 520, H = 340, m = {l: 46, r: 16, t: 14, b: 42};
  const svg = svgBox(host, W, H), [x0, x1] = o.xd, [y0, y1] = o.yd;
  const X = v => m.l + (v - x0) / (x1 - x0) * (W - m.l - m.r), Y = v => o.down ? m.t + (v - y0) / (y1 - y0) * (H - m.t - m.b) : H - m.b - (v - y0) / (y1 - y0) * (H - m.t - m.b);
  if (o.zero) el("rect", {x: X(0), y: Y(y1), width: X(x1) - X(0), height: Y(0) - Y(y1), style: "fill:rgba(93,184,145,.07)"}, svg);
  o.xt.forEach(t => { el("line", {x1: X(t), x2: X(t), y1: m.t, y2: H - m.b, style: `stroke:${o.zero && t === 0 ? "var(--muted)" : "var(--line)"};${o.zero && t === 0 ? "" : "stroke-dasharray:2 3"}`}, svg); txt(svg, X(t), H - m.b + 15, t, {"text-anchor": "middle", style: "fill:var(--muted);font-size:10.5px"}); });
  o.yt.forEach(t => { el("line", {x1: m.l, x2: W - m.r, y1: Y(t), y2: Y(t), style: `stroke:${o.zero && t === 0 ? "var(--muted)" : "var(--line)"};${o.zero && t === 0 ? "" : "stroke-dasharray:2 3"}`}, svg); txt(svg, m.l - 7, Y(t) + 3, t, {"text-anchor": "end", style: "fill:var(--muted);font-size:10.5px"}); });
  if (o.diag) { const d = el("line", {x1: X(x0), y1: Y(y0), x2: X(x1), y2: Y(y1), class: "draw", style: "--len:520;stroke:var(--blue);stroke-width:1.5;stroke-dasharray:520"}, svg); }
  txt(svg, (m.l + W - m.r) / 2, H - 6, o.xl, {"text-anchor": "middle", style: "fill:var(--muted);font-size:11px"});
  txt(svg, 13, (m.t + H - m.b) / 2, o.yl, {"text-anchor": "middle", transform: `rotate(-90 13 ${(m.t + H - m.b) / 2})`, style: "fill:var(--muted);font-size:11px"});
  const fin = new Set(D[side].final.map(r => r.name)), placed = [];
  [...pts].sort((a, b) => fin.has(a.name) - fin.has(b.name)).forEach((p, i) => {
    if (p[xk] == null || p[yk] == null) return; const f = fin.has(p.name);
    const cx = X(Math.max(x0, Math.min(x1, p[xk]))), cy = Y(Math.max(y0, Math.min(y1, p[yk]))), r = o.size ? 3 + Math.sqrt(p[o.size]) / 3.4 : (f ? 6 : 4.5);
    const c = el("circle", {cx, cy, r, class: "dot", style: `fill:${f ? "var(--gold)" : "var(--grey)"};fill-opacity:${f ? .9 : .8};stroke:var(--bg);stroke-width:1.5;animation-delay:${200 + i * 25}ms`}, svg);
    el("title", {}, c).textContent = `${p.name}: ${o.tip(p)}`;
    if (f) { let ty = cy - r - 5; while (placed.some(q => Math.abs(q[0] - cx) < 62 && Math.abs(q[1] - ty) < 12)) ty -= 12; placed.push([cx, ty]);
      txt(svg, cx, ty, p.name.split(" ").slice(-1)[0], {"text-anchor": cx > W - 70 ? "end" : cx < 90 ? "start" : "middle", class: "fadein", style: `fill:var(--ink-2);font-size:10.5px;font-weight:500;animation-delay:${700 + i * 25}ms`}); } });
}

function players() {
  const C = CFG[side], pool = D[side].pool;
  podium(); list(); detail();
  scatter(document.getElementById("agree"), pool, "full_model_rank", "pressure_only_rank", {xd: [0, 42], yd: [0, 42], down: true, diag: true, xt: [1, 10, 20, 30, 40], yt: [1, 10, 20, 30, 40],
    xl: "Full model rank", yl: "Pressure-only rank", tip: p => `full ${p.full_model_rank}, pressure-only ${p.pressure_only_rank}`});
  document.getElementById("split-note").textContent = C.splitNote;
  scatter(document.getElementById("split"), pool, C.ipl, C.t20i, {xd: C.ext, yd: C.ext, zero: true, xt: C.ticks, yt: C.ticks, size: "pressure_balls",
    xl: "IPL, " + C.unit, yl: "T20I, " + C.unit, tip: p => `IPL ${fmt(p[C.ipl], 2)}, T20I ${fmt(p[C.t20i], 2)}, ${p.pressure_balls} pressure balls`});
  document.getElementById("excluded").innerHTML = D[side].excluded.map(x => `<div class="exc"><b>${x.name}</b> <span class="m">· model rank ${x.model_rank}</span><p>${x.reason}</p></div>`).join("");
}

/* ---------- matchup network ---------- */
function network() {
  const N = D.network, bats = D.bat.final.map(r => r.name), bows = D.bowl.final.map(r => r.name);
  const W = 760, H = 560, xb = 190, xw = W - 190, top = 30, step = (H - 2 * top) / 9;
  const yb = i => top + i * step, svg = svgBox(document.getElementById("net"), W, H);
  const mxb = Math.max(...N.map(e => e.balls)), links = [];
  N.forEach((e, k) => { const i = bats.indexOf(e.bat), j = bows.indexOf(e.bowl), y1 = yb(i), y2 = yb(j), mid = (xb + xw) / 2;
    const p = el("path", {d: `M${xb + 10},${y1} C${mid},${y1} ${mid},${y2} ${xw - 10},${y2}`, class: "link draw",
      style: `--len:700;stroke:${e.vs_expected >= 0 ? "var(--blue)" : "var(--pink)"};stroke-width:${1 + 7 * e.balls / mxb};opacity:.55;animation-delay:${k * 12}ms`}, svg);
    el("title", {}, p).textContent = `${e.bat} v ${e.bowl}: ${e.balls} balls, ${e.runs} runs, ${e.outs} out, ${fmt(e.vs_expected, 1)} runs vs expected`;
    links.push({e, p}); });
  const nodes = [];
  [[bats, xb, "end", "bat"], [bows, xw, "start", "bowl"]].forEach(([names, x, anchor, s]) => names.forEach((n, i) => {
    const g = el("g", {class: "node fadein", style: `animation-delay:${300 + i * 50}ms`}, svg);
    el("circle", {cx: x, cy: yb(i), r: 6, style: `fill:${s === "bat" ? "var(--blue)" : "var(--pink)"};stroke:var(--bg);stroke-width:2`}, g);
    const t = txt(g, anchor === "end" ? x - 14 : x + 14, yb(i) + 4, n, {"text-anchor": anchor, style: "fill:var(--ink-2)"});
    nodes.push({g, t, n, s}); g.onmouseenter = () => focus(n, s); g.onclick = () => focus(n, s); }));
  txt(svg, xb, 12, "BATTERS", {"text-anchor": "end", style: "fill:var(--muted);font-size:10.5px;letter-spacing:.14em"});
  txt(svg, xw, 12, "BOWLERS", {"text-anchor": "start", style: "fill:var(--muted);font-size:10.5px;letter-spacing:.14em"});
  function focus(n, s) {
    links.forEach(({e, p}) => { const on = (s === "bat" ? e.bat : e.bowl) === n; p.style.opacity = on ? .95 : .06; });
    nodes.forEach(o => o.t.style.fill = o.n === n ? "var(--gold)" : "var(--ink-2)");
    const mine = N.filter(e => (s === "bat" ? e.bat : e.bowl) === n).sort((a, b) => b.balls - a.balls);
    const tb = mine.reduce((a, e) => a + e.balls, 0), tv = mine.reduce((a, e) => a + e.vs_expected, 0), to = mine.reduce((a, e) => a + e.outs, 0);
    const good = s === "bat" ? tv : -tv;
    document.getElementById("netside").innerHTML = `<span class="eyebrow">${s === "bat" ? "Batter" : "Bowler"}</span><h3>${n}</h3>
      <div class="drk" style="margin-bottom:12px">Against the other list: ${tb} balls, ${to} dismissal${to === 1 ? "" : "s"}, <span class="${cls(good)}">${fmt(good, 1)} runs ${s === "bat" ? "above expected" : "saved"}</span></div>
      ${mine.slice(0, 8).map(e => { const v = s === "bat" ? e.vs_expected : -e.vs_expected;
        return `<div class="hh"><span>${s === "bat" ? e.bowl : e.bat} <span style="color:var(--muted)">· ${e.balls} balls${e.outs ? ", " + e.outs + " out" : ""}</span></span><span class="${cls(v)}">${fmt(v, 1)}</span></div>`; }).join("")}`;
  }
  const busiest = bats.map(n => [n, N.filter(e => e.bat === n).reduce((a, e) => a + e.balls, 0)]).sort((a, b) => b[1] - a[1])[0][0];
  later(() => focus(busiest, "bat"), 1500);
  document.getElementById("netside").innerHTML = `<span class="eyebrow">Network</span><h3>${N.length} matchups</h3><div class="drk">${N.reduce((a, e) => a + e.balls, 0)} balls between the two lists.</div>`;
}

/* ---------- method ---------- */
function heat() {
  const g = D.facts.chase_pressure_grid, overs = [...new Set(g.map(c => c.overs))], wk = ["0-1", "2-3", "4-5", "6-7", "8+"];
  const W = 540, H = 260, m = {l: 92, r: 6, t: 26, b: 6}, cw = (W - m.l - m.r) / wk.length, ch = (H - m.t - m.b) / overs.length;
  const svg = svgBox(document.getElementById("heat"), W, H);
  wk.forEach((w, j) => txt(svg, m.l + j * cw + cw / 2, 14, w + " wkts", {"text-anchor": "middle", style: "fill:var(--muted);font-size:11px"}));
  overs.forEach((o, i) => { txt(svg, m.l - 10, m.t + i * ch + ch / 2 + 4, "Overs " + o, {"text-anchor": "end", style: "fill:var(--muted);font-size:11px"});
    wk.forEach((w, j) => { const c = g.find(c => c.overs === o && c.wickets === w), v = c ? c.share : null;
      el("rect", {x: m.l + j * cw + 2, y: m.t + i * ch + 2, width: cw - 4, height: ch - 4, rx: 6, class: "cell",
        style: `fill:${v == null ? "var(--line-2)" : `rgba(91,134,229,${.08 + v * 1.9})`};animation-delay:${(i + j) * 60}ms`}, svg);
      if (v != null) txt(svg, m.l + j * cw + cw / 2, m.t + i * ch + ch / 2 + 4, Math.round(v * 100) + "%", {"text-anchor": "middle", class: "fadein",
        style: `fill:${v > .25 ? "#fff" : "var(--ink-2)"};font-size:12px;font-weight:600;animation-delay:${300 + (i + j) * 60}ms`}); }); });
}

function phase() {
  const b = D.facts.pressure_by_phase_bat, w = D.facts.pressure_by_phase_bowl, ph = [["PP", "Powerplay"], ["MID", "Middle overs"], ["DEATH", "Death overs"]];
  const tb = Object.values(b).reduce((a, c) => a + c), tw = Object.values(w).reduce((a, c) => a + c);
  const host = document.getElementById("phase");
  host.innerHTML = ph.map(([k, n]) => `<div style="margin:16px 0 6px;font-size:12.5px;font-weight:600">${n}</div>
    ${[[b[k] / tb, "--blue"], [w[k] / tw, "--pink"]].map(([v, c]) => `<div style="display:flex;align-items:center;gap:12px;margin:6px 0"><div class="pbar" style="flex:1"><i data-w="${v * 100 / .5}" style="background:var(${c})"></i></div><span style="width:42px;text-align:right;font-weight:600">${Math.round(v * 100)}%</span></div>`).join("")}`).join("");
  later(() => host.querySelectorAll(".pbar i").forEach(i => i.style.width = i.dataset.w + "%"), 80);
}

function stats(id, items, note) {
  const host = document.getElementById(id);
  host.innerHTML = `<div class="statrow">${items.map(i => `<div><div class="stat" style="color:${i[4] || "var(--ink)"}">0</div><span>${i[3]}</span></div>`).join("")}</div><p class="note" style="margin:0">${note}</p>`;
  host.querySelectorAll(".stat").forEach((s, k) => countUp(s, items[k][0], items[k][1], items[k][2]));
}

function method() {
  heat(); phase();
  const o = D.oot, f = D.facts;
  stats("oot", [[o.bowl.top_quartile_stays_above_median * 100, 0, "%", "of the best quarter of bowlers in 2022–24 stayed above the median", "var(--pink)"],
                [o.bat.top_quartile_stays_above_median * 100, 0, "%", "same for batters", "var(--blue)"], [o.bowl.rank_correlation, 2, "", "bowler rank correlation (batters " + o.bat.rank_correlation.toFixed(2) + ")"]],
    "Bowling under pressure repeats; batting under pressure is noisy from one period to the next. That is why the lists lean on long records and on agreement between two fits rather than one hot season.");
  stats("stakes", [[f.pressure_share_high_stakes * 100, 0, "%", "of bowling pressure balls came in high-stakes games", "var(--gold)"], [0.3, 2, "", "swing in top-four chance that marks a virtual knockout"], [1, 1, "", "stake of a final or eliminator"]],
    "A ball's pressure is what the side could lose on it, multiplied by one plus the match stake. A tight finish in a dead rubber counts for less than the same finish when the season is on the line.");
}

/* ---------- routing ---------- */
function show(tab) {
  document.querySelectorAll("nav.tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === tab));
  const main = document.getElementById("main"), tpl = tab === "net" ? "t-net" : tab === "method" ? "t-method" : "t-players";
  main.innerHTML = ""; main.appendChild(document.getElementById(tpl).content.cloneNode(true));
  if (tab === "bat" || tab === "bowl") { side = tab; selected = 0; players(); } else if (tab === "net") network(); else method();
}
document.querySelectorAll("nav.tabs button").forEach(b => b.onclick = () => show(b.dataset.tab));
facts(); show("bat");
</script>
